# =============================================================================
# HIDDEN GEMS POOL
#
# Replicates the Keyes (1972) methodology:
#   His DJIA 30        =  our "universe" above (actual DJIA 30 components)
#   His Forbes random  =  our monthly random draw from this pool
#
# Each monthly update randomly selects N stocks from this pool
# (default N=30 — see config.yaml hidden_gems.n_select).
# The random seed is the prediction month so selections are stable
# within a month but rotate across months — exactly as Keyes did.
#
# Criteria for inclusion:
#   • Listed on Nasdaq or NYSE
#   • Market cap roughly $1B–$50B (mid-cap, mostly)
#   • Sufficient yfinance data coverage
#   • NOT already in the Core 30 above
#   • Diverse sectors to allow cross-sector comparison
# =============================================================================

